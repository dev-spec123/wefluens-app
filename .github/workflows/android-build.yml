name: android-build

# Manual only — a free, no-queue alternative to the EAS build queue.
# Builds a standalone release APK on GitHub's Linux runners and uploads it as an
# artifact. Needs these repo secrets (a base64 keystore, shared with local builds
# so the signature stays consistent):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wefluens-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wefluens-mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install JS deps
        run: npm ci

      - name: Prebuild (generate android/)
        run: npx expo prebuild -p android --no-install

      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KS_B64" | tr -d '\r\n ' | base64 -d > android/app/release.keystore

      - name: Build release APK
        working-directory: wefluens-mobile/android
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/app/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - uses: actions/upload-artifact@v4
        with:
          name: wefluens-connect-android-apk
          path: wefluens-mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
