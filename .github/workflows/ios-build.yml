name: iOS Build Check

# Compiles the native iOS app (WeConnect) on a cloud macOS runner so Swift changes
# get verified without a local Mac. Simulator build only — no code signing needed.

on:
  push:
    branches: [main]
    paths:
      - 'ios-wefluens/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios-wefluens/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compile (iOS Simulator)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode version
        run: xcodebuild -version

      - name: Allow SPM macros without an interactive prompt
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios-wefluens/WeConnect.xcodeproj \
            -scheme WeConnect

      - name: Build (compile only — iOS Simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios-wefluens/WeConnect.xcodeproj \
            -scheme WeConnect \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build
