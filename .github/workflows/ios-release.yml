name: iOS Release (upload to App Store Connect)

# Builds, signs, and uploads the native iOS app (WeConnect) to App Store Connect
# from a cloud macOS runner — no local Mac needed. Manual trigger only.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID     — App Store Connect API Key ID
#   ASC_ISSUER_ID  — App Store Connect API Issuer ID
#   ASC_KEY_P8     — full contents of the AuthKey_XXXX.p8 file (paste as-is)
#
# Signing is automatic via the API key (-allowProvisioningUpdates): Xcode creates
# the distribution certificate + App Store provisioning profile on the runner.

on:
  workflow_dispatch:

jobs:
  release:
    name: Build & upload
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Allow SPM macros without an interactive prompt
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Generate Config.swift (gitignored; PUBLIC anon key + URL)
        run: |
          cat > ios-wefluens/WeConnect/Config.swift <<'SWIFT'
          import Foundation

          enum Config {
              static let EXPO_PUBLIC_SUPABASE_URL = "https://zlyufsfbzssjseprkuvd.supabase.co"
              static let EXPO_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpseXVmc2ZienNzanNlcHJrdXZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3Mjg3MzAsImV4cCI6MjA5NzMwNDczMH0.H1wCxe01gaUJVLRCoPNAZgnHefUTbaOojRDknUe-9RM"
          }
          SWIFT

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/AuthKey.p8" ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios-wefluens/WeConnect.xcodeproj \
            -scheme WeConnect

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          BUILD_NUMBER=$(( GITHUB_RUN_NUMBER + 10 ))
          echo "Using build number $BUILD_NUMBER"
          xcodebuild archive \
            -project ios-wefluens/WeConnect.xcodeproj \
            -scheme WeConnect \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WeConnect.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM=87P4XKCVDG \
            MARKETING_VERSION=1.0.3 \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            CODE_SIGN_STYLE=Automatic

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>87P4XKCVDG</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/WeConnect.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          echo "Uploading $IPA"
          set +e
          OUT=$(xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -qiE "UPLOAD FAILED|Validation failed|ERROR:"; then
            echo "::error::App Store upload failed (altool reported errors above)"
            exit 1
          fi
          echo "Upload OK"
